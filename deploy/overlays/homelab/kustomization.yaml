apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - path: namespace-delete-patch.yaml
  - path: image-patch.yaml
  - target:
      kind: ConfigMap
      name: homelab-portal
    patch: |-
      - op: replace
        path: /data/PORTAL_BASE_URL
        value: https://portal.taildf6cd4.ts.net
      - op: replace
        path: /data/OIDC_ISSUER_URL
        value: https://keycloak.taildf6cd4.ts.net/realms/homelab
      - op: replace
        path: /data/OIDC_BACKCHANNEL_URL
        value: http://keycloak.keycloak.svc.cluster.local:8080/realms/homelab

  # Non-secret site configuration observed from the homelab cluster.
  # Verify selectors and API endpoints again if cluster networking changes.
  - target:
      kind: NetworkPolicy
      name: homelab-portal
    patch: |-
      - op: replace
        path: /spec/ingress/0/from/0/namespaceSelector/matchLabels/kubernetes.io~1metadata.name
        value: tailscale
      - op: replace
        path: /spec/ingress/0/from/0/podSelector/matchLabels
        value:
          tailscale.com/parent-resource: homelab-portal
          tailscale.com/parent-resource-ns: portal
          tailscale.com/parent-resource-type: ingress
      - op: replace
        path: /spec/ingress/1/from/0/namespaceSelector/matchLabels/kubernetes.io~1metadata.name
        value: monitoring
      - op: replace
        path: /spec/ingress/1/from/0/podSelector/matchLabels
        value:
          app.kubernetes.io/name: prometheus
          operator.prometheus.io/name: monitoring-kube-prometheus-prometheus
      - op: replace
        path: /spec/egress/1/to/0/ipBlock/cidr
        value: 10.43.0.1/32
      - op: replace
        path: /spec/egress/2/to/0/ipBlock/cidr
        value: 192.168.1.201/32
