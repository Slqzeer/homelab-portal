apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - path: namespace-delete-patch.yaml
  - path: image-patch.yaml
  - target:
      kind: ConfigMap
      name: homelab-portal
    patch: |-
      - op: replace
        path: /data/OIDC_ISSUER_URL
        value: https://keycloak.taildf6cd4.ts.net/realms/homelab
      - op: replace
        path: /data/OIDC_BACKCHANNEL_URL
        value: http://keycloak.keycloak.svc.cluster.local:8080/realms/homelab

  # Non-secret site configuration. These example addresses intentionally
  # cannot reach a real API. Set exact VIP/endpoint /32s (or IPv6 /128s).
  # Verify selectors against the actual proxy, scraper, DNS and Keycloak pods.
  - target:
      kind: NetworkPolicy
      name: homelab-portal
    patch: |-
      - op: replace
        path: /spec/ingress/0/from/0/namespaceSelector/matchLabels/kubernetes.io~1metadata.name
        value: tailscale
      - op: replace
        path: /spec/ingress/0/from/0/podSelector/matchLabels
        value:
          tailscale.com/parent-resource: homelab-portal
          tailscale.com/parent-resource-ns: portal
          tailscale.com/parent-resource-type: ingress
      - op: replace
        path: /spec/ingress/1/from/0/namespaceSelector/matchLabels/kubernetes.io~1metadata.name
        value: monitoring
      - op: replace
        path: /spec/ingress/1/from/0/podSelector/matchLabels
        value:
          app.kubernetes.io/name: prometheus
          operator.prometheus.io/name: homelab
      - op: replace
        path: /spec/egress/1/to/0/ipBlock/cidr
        value: 192.0.2.1/32
      - op: replace
        path: /spec/egress/1/to/1/ipBlock/cidr
        value: 198.51.100.1/32
