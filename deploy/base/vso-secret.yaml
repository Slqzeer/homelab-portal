# External GitOps supplies VaultAuth and the real non-secret mount/path.
# This object contains references only; no Vault credentials or secret values.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: homelab-portal
spec:
  vaultAuthRef: homelab-portal
  type: kv-v2
  mount: replace-with-kv-mount
  path: replace-with-portal-secret-path
  refreshAfter: 1m
  hmacSecretData: true
  destination:
    create: true
    name: homelab-portal-secrets
  rolloutRestartTargets:
    - kind: Deployment
      name: homelab-portal
