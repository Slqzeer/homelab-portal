version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      go-compatible:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      web-compatible:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # @astrojs/check (0.9.12) accepts only TypeScript ^5 || ^6; drop this once
      # it accepts 7 (homelab-portal#5).
      - dependency-name: typescript
        versions: ['>=7']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      base-images:
        patterns: ['*']
